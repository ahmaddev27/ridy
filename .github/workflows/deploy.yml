name: Deploy

# Zero-touch deploy: a push to main provisions and updates the VPS entirely over
# SSH — installs Docker if missing, clones the repo on first run, writes .env
# from secrets, then builds + migrates. You never open the server manually.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST                — server IP or hostname (e.g. reidey.de)
#   SSH_USER                — deploy user (e.g. fleeteye)
#   SSH_KEY                 — the PRIVATE SSH key (contents)
#   REPO_URL                — git URL the server pulls from (https with token or ssh)
#   DOMAIN                  — reidey.de
#   APP_KEY                 — base64 app key (php artisan key:generate --show); or leave blank to auto-generate
#   DB_PASSWORD, DB_ROOT_PASSWORD, DISPATCH_INGEST_SECRET  — strong random strings
#   FCM_CREDENTIALS_JSON    — the full Google service-account JSON (Firebase →
#                             Project settings → Service accounts → Generate key).
#                             Blank = pushes are only logged, never delivered.
#   FCM_PROJECT_ID          — optional; defaults to the id inside the JSON
on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Provision and deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Use whichever you set: an SSH private key, OR a server password.
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          # Pass secrets as env so they never appear in the script text/logs.
          envs: REPO_URL,DOMAIN,APP_KEY,DB_PASSWORD,DB_ROOT_PASSWORD,DISPATCH_INGEST_SECRET,FCM_CREDENTIALS_JSON,FCM_PROJECT_ID,NOMINATIM_URL,OSRM_URL,ALERT_EMAIL,OTP_TEST_CODE,SENTRY_LARAVEL_DSN,NEXT_PUBLIC_SENTRY_DSN,DAEMON_SENTRY_DSN
          script_stop: true
          script: |
            set -e
            APP_DIR="$HOME/ridy"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            # --- 1. Install Docker on first run -------------------------------
            # Runs as root, so no sudo. get.docker.com doesn't support AlmaLinux/
            # RHEL, so use the official Docker dnf repo there; fall back to the
            # convenience script on Debian/Ubuntu.
            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              if command -v dnf >/dev/null 2>&1; then
                dnf -y install dnf-plugins-core || true
                dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
                dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                systemctl enable --now docker
              else
                curl -fsSL https://get.docker.com | sh
                systemctl enable --now docker || true
              fi
            fi

            # --- 2. Clone on first run, pull thereafter -----------------------
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            # Re-point origin to the current REPO_URL every run, so a rotated
            # access token in the REPO_URL secret self-heals the checkout instead
            # of fetch failing forever against a stale/expired embedded token
            # ("could not read Username for https://github.com").
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main

            # --- 3. Write .env from secrets (idempotent) ----------------------
            # Persist a generated APP_KEY so it never rotates between deploys
            # (a new key would make previously-encrypted data undecryptable).
            if [ -z "$APP_KEY" ] && [ -f "$APP_DIR/.app_key" ]; then APP_KEY="$(cat "$APP_DIR/.app_key")"; fi
            if [ -z "$APP_KEY" ]; then APP_KEY="base64:$(head -c 32 /dev/urandom | base64 | tr -d '\n')"; printf '%s' "$APP_KEY" > "$APP_DIR/.app_key"; fi

            # Reverb (real-time offers → driver app). The KEY is a PUBLIC client key
            # and MUST equal the value baked into the released app build
            # (driver-app/app.json → extra.reverbKey), so the app can connect without
            # a rebuild. The SECRET is server-only (signs the broadcasting-auth); it is
            # generated once and persisted so it never rotates between deploys. Without
            # these the reverb/queue/scheduler containers logged "REVERB_APP_* not set".
            REVERB_APP_KEY="8susv98cxftu6i3gzgfj"
            REVERB_APP_ID="reidey"
            if [ -z "$REVERB_APP_SECRET" ] && [ -f "$APP_DIR/.reverb_secret" ]; then REVERB_APP_SECRET="$(cat "$APP_DIR/.reverb_secret")"; fi
            if [ -z "$REVERB_APP_SECRET" ]; then REVERB_APP_SECRET="$(head -c 32 /dev/urandom | base64 | tr -dc 'a-z0-9' | head -c 24)"; printf '%s' "$REVERB_APP_SECRET" > "$APP_DIR/.reverb_secret"; fi

            # FCM HTTP v1: materialise the service-account JSON from the secret so
            # the backend container can read it (./backend is mounted at /var/www).
            # Empty secret -> no file -> FcmPushSender falls back to logging only.
            FCM_CREDENTIALS_PATH=""
            if [ -n "$FCM_CREDENTIALS_JSON" ]; then
              mkdir -p "$APP_DIR/backend/storage/app"
              printf '%s' "$FCM_CREDENTIALS_JSON" > "$APP_DIR/backend/storage/app/fcm-credentials.json"
              FCM_CREDENTIALS_PATH="/var/www/storage/app/fcm-credentials.json"
            fi

            # Write .env one safely-quoted line at a time. The old unquoted heredoc
            # (<<EOF, not <<'EOF') had to interpolate $DB_PASSWORD & friends — which also
            # meant the SHELL expanded any $, backtick or backslash INSIDE a secret value:
            # a password containing $ was silently truncated, and one containing `…` or
            # $(…) executed on the server as the deploy user. Values were also written
            # unquoted, so a secret holding a space or # was misparsed by dotenv. env_line
            # escapes backslash, " and $ and wraps the value in double quotes — exactly the three
            # escapes phpdotenv understands — so what the secret holds is what Laravel reads.
            env_line() {
              printf '%s="%s"\n' "$1" "$(printf '%s' "$2" | tr -d '\r' | sed -e 's/[\\"$]/\\&/g')" >> .env
            }

            : > .env
            env_line DOMAIN "$DOMAIN"
            env_line SITE_ADDRESS "$DOMAIN"
            env_line APP_KEY "$APP_KEY"
            env_line SESSION_SECURE_COOKIE "true"
            env_line SESSION_SAME_SITE "lax"
            env_line REVERB_APP_ID "$REVERB_APP_ID"
            env_line REVERB_APP_KEY "$REVERB_APP_KEY"
            env_line REVERB_APP_SECRET "$REVERB_APP_SECRET"
            env_line DB_DATABASE "ridy"
            env_line DB_USERNAME "ridy"
            env_line DB_PASSWORD "$DB_PASSWORD"
            env_line DB_ROOT_PASSWORD "$DB_ROOT_PASSWORD"
            env_line DISPATCH_INGEST_SECRET "$DISPATCH_INGEST_SECRET"
            env_line FCM_CREDENTIALS "$FCM_CREDENTIALS_PATH"
            env_line FCM_PROJECT_ID "$FCM_PROJECT_ID"
            env_line ALERT_EMAIL "$ALERT_EMAIL"
            env_line OTP_TEST_CODE "$OTP_TEST_CODE"
            env_line SENTRY_LARAVEL_DSN "$SENTRY_LARAVEL_DSN"
            env_line NEXT_PUBLIC_SENTRY_DSN "$NEXT_PUBLIC_SENTRY_DSN"
            env_line DAEMON_SENTRY_DSN "$DAEMON_SENTRY_DSN"
            env_line NOMINATIM_URL "$NOMINATIM_URL"
            env_line OSRM_URL "$OSRM_URL"

            # Every key must be present exactly once: a value that swallowed a newline
            # would otherwise silently shift the rest of the file into garbage.
            for key in DOMAIN SITE_ADDRESS APP_KEY SESSION_SECURE_COOKIE SESSION_SAME_SITE REVERB_APP_ID REVERB_APP_KEY REVERB_APP_SECRET DB_DATABASE DB_USERNAME DB_PASSWORD DB_ROOT_PASSWORD DISPATCH_INGEST_SECRET FCM_CREDENTIALS FCM_PROJECT_ID ALERT_EMAIL OTP_TEST_CODE SENTRY_LARAVEL_DSN NEXT_PUBLIC_SENTRY_DSN DAEMON_SENTRY_DSN NOMINATIM_URL OSRM_URL; do
              count=$(grep -c "^$key=" .env || true)
              if [ "$count" != "1" ]; then
                echo "::error::.env is malformed: $key appears $count time(s)"; exit 1
              fi
            done

            # --- 4. Free the web ports + build + start ------------------------
            # AlmaLinux may ship Apache (httpd) which grabs port 80/443 and blocks
            # Caddy. Stop and mask it so it can never resurface.
            systemctl stop httpd 2>/dev/null || true
            systemctl disable httpd 2>/dev/null || true
            systemctl mask httpd 2>/dev/null || true

            # Force-recreate the app services so they pick up the freshly written
            # .env (domain/config). The dispatch-daemon is deliberately EXCLUDED
            # and brought up separately without --force-recreate, so an app-only
            # deploy does NOT restart it — its live Uber streams keep running and
            # only blip when the daemon's own code/config actually changed. mysql
            # is likewise left running (no needless DB restart).
            # --renew-anon-volumes: the app services mount an ANONYMOUS volume at
            # /var/www/vendor (to keep the ./backend bind-mount from hiding the image's
            # vendor). Docker populates that volume from the image ONLY on first
            # creation and then reuses it — so a freshly built image with a NEW
            # dependency (e.g. laravel/reverb) was shadowed by the stale vendor volume,
            # crash-looping queue/scheduler with "ReverbServiceProvider not found" on
            # every deploy. Renewing the anon volumes refreshes vendor from the new
            # image each deploy. (Named volumes like the DB are untouched.)
            # Self-heal a prior INTERRUPTED --force-recreate: Compose renames the old
            # container to "<hash>_ridy-<svc>-1" before replacing it; if a deploy died
            # in between, the next recreate fails with "container name /ridy-<svc>-1 is
            # already in use". Sweep any parked leftovers first (they carry a "_ridy-"
            # infix; healthy containers are "ridy-..." with no leading hash).
            docker ps -aq --filter "name=_ridy-" | xargs -r docker rm -f || true
            $COMPOSE up -d --build --force-recreate --renew-anon-volumes --remove-orphans backend caddy frontend scheduler queue reverb
            # Daemon: recreate only if its image/config changed (streams stay up otherwise).
            $COMPOSE up -d --build dispatch-daemon

            # The repo is bind-mounted and owned by root, so make Laravel's
            # writable dirs writable by php-fpm (www-data) — otherwise any log or
            # cache write 500s the request.
            $COMPOSE exec -T backend sh -c "chown -R www-data:www-data storage bootstrap/cache && chmod -R 775 storage bootstrap/cache" || true

            # --- 5. Wait for MySQL, then migrate ------------------------------
            # Readiness and migration are SEPARATE concerns. The old loop ran
            # `migrate --force 2>/dev/null` up to 30 times and could not tell "the
            # database isn't up yet" from "this migration throws": it discarded the
            # error, and once the attempts ran out the script simply carried on to
            # config:cache and printed "Deploy complete". A broken migration shipped
            # green with its failure text thrown away. Now readiness is polled with
            # mysqladmin (the same probe as the service healthcheck), then migrate
            # runs exactly ONCE, unredirected, with set -e free to fail the job.
            echo "Waiting for the database..."
            db_ready=""
            for i in $(seq 1 30); do
              if $COMPOSE exec -T mysql mysqladmin ping -h localhost -p"$DB_ROOT_PASSWORD" --silent >/dev/null 2>&1; then
                db_ready=1
                break
              fi
              sleep 3
            done
            if [ -z "$db_ready" ]; then
              echo "::error::database never became reachable (90s) — aborting before migrate."
              exit 1
            fi

            $COMPOSE exec -T backend php artisan migrate --force

            # Seed the admin user only on the very first deploy.
            if [ ! -f "$APP_DIR/.seeded" ]; then
              $COMPOSE exec -T backend php artisan db:seed --force || true
              touch "$APP_DIR/.seeded"
            fi

            # Clear ALL stale caches (config + routes + views + events), then
            # re-cache config. Clearing routes is essential: a cached route file
            # would keep serving the old middleware stack, so new route guards
            # (e.g. fleet.connected) would silently not apply.
            # Sync PHP deps into the bind-mounted code: the image installs vendor/,
            # but the ./backend:/var/www mount shadows it with the host's copy, so a
            # newly added package (e.g. Sentry) would be missing at runtime. Install
            # against the live volume so vendor always matches composer.lock.
            # Retry: a single transient failure here used to be swallowed by
            # "|| true", leaving vendor/ stale (e.g. missing pusher-php-server,
            # which the reverb broadcaster needs → "Class Pusher\Pusher not
            # found" at runtime). Try a few times before giving up.
            for i in 1 2 3; do
              if $COMPOSE exec -T backend composer install --no-dev --optimize-autoloader --no-interaction; then break; fi
              echo "composer install failed (attempt $i) — retrying in 20s..."; sleep 20
            done

            # These steps change RUNTIME behaviour, so they get the same
            # retry-then-fail treatment composer install now has. A blanket "|| true"
            # let a failed package:discover or config:cache leave the container running
            # the PREVIOUS configuration while the deploy still reported success — the
            # exact silent failure the composer retry was added to stop.
            artisan_required() {
              for i in 1 2 3; do
                if $COMPOSE exec -T backend php artisan "$@"; then return 0; fi
                echo "artisan $* failed (attempt $i) — retrying in 10s..."
                sleep 10
              done
              echo "::error::artisan $* failed three times — aborting the deploy."
              return 1
            }

            artisan_required optimize:clear
            # Link public/storage so uploaded assets (invoice + email logos on the
            # public disk) are actually served at {APP_URL}/storage/... — without
            # this the logo URL 404s and images never render in the PDF or preview.
            # Non-fatal: it legitimately fails when the link already exists.
            $COMPOSE exec -T backend php artisan storage:link || echo "::warning::storage:link failed (already linked?) — continuing"
            # Rebuild the package-discovery manifest: the image installs deps with
            # --no-scripts (so post-autoload-dump never runs discover), and
            # bootstrap/cache is bind-mounted, so a stale packages.php would keep a
            # newly added provider (e.g. Sentry) from ever registering.
            artisan_required package:discover
            artisan_required config:cache

            # Cap the Docker build cache so it can't slowly fill the disk (it grew
            # to 80GB before). Keeps the most recent 5GB for fast rebuilds; drops
            # the rest. Also sweep dangling images left by --build.
            docker builder prune -f --keep-storage 5GB || true
            docker image prune -f || true

            # "Deploy complete" must mean the app actually answers — otherwise a green
            # run says nothing about whether the site came back up.
            echo "Checking https://$DOMAIN/api/v1/health ..."
            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 15 "https://$DOMAIN/api/v1/health" >/dev/null; then
                health_ok=1
                break
              fi
              echo "health check not ready (attempt $i) — retrying in 6s..."
              sleep 6
            done
            if [ -z "$health_ok" ]; then
              echo "::error::health check failed at https://$DOMAIN/api/v1/health"
              exit 1
            fi

            echo "Deploy complete: https://$DOMAIN"
        env:
          REPO_URL: ${{ secrets.REPO_URL }}
          DOMAIN: ${{ secrets.DOMAIN }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DISPATCH_INGEST_SECRET: ${{ secrets.DISPATCH_INGEST_SECRET }}
          FCM_CREDENTIALS_JSON: ${{ secrets.FCM_CREDENTIALS_JSON }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          NOMINATIM_URL: ${{ secrets.NOMINATIM_URL }}
          OSRM_URL: ${{ secrets.OSRM_URL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          OTP_TEST_CODE: ${{ secrets.OTP_TEST_CODE }}
          SENTRY_LARAVEL_DSN: ${{ secrets.SENTRY_LARAVEL_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          DAEMON_SENTRY_DSN: ${{ secrets.DAEMON_SENTRY_DSN }}
