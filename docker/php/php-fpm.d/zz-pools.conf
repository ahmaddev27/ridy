; Reidey PHP-FPM pools. Loaded after the image's www.conf / zz-docker.conf
; (alphabetical include order), so the [www] values here override the stock
; pm.max_children = 5 that let five slow requests stall the whole platform.
;
; Two pools:
;   [www]      :9000  everything (dashboard, driver app, extension, admin)
;   [dispatch] :9001  ONLY the daemon's internal offer/status ingest
;                     (/api/v1/internal/dispatch/*, routed by docker/Caddyfile)
; so dashboard/driver polling can never queue the next offer's ingest behind it
; inside Uber's ~5 s accept window.
;
; Sizing: a Laravel worker is ~40-70 MB RSS. 32 + 12 workers stay well under the
; box's RAM and far below MySQL's default max_connections (151), which the
; scheduler, queue worker and reverb also draw from.
;
; request_slowlog_timeout is deliberately NOT set: FPM's slowlog needs
; CAP_SYS_PTRACE, which the container does not have, so it would only spam
; "ptrace failed" errors.

[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000
listen.backlog = 511
; Wall-clock cap per request. max_execution_time only counts CPU time, so a
; request stuck on a network call (Uber sync, SMTP, a hung geocoder) would
; otherwise hold its worker forever. 120 s is above the slowest legitimate
; call (UberAuthClient, 60 s timeout).
request_terminate_timeout = 120s

[dispatch]
user = www-data
group = www-data
listen = 9001
listen.backlog = 511
; Same runtime environment as [www] (zz-docker/docker.conf only configure the
; [www] pool): keep the container env (APP_KEY, DB_*, ... come from compose,
; not a .env file) and route worker output to the container log.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
; Ingest must answer inside the daemon's 8 s apiTimeout; anything still running
; after 60 s is wedged.
request_terminate_timeout = 60s
