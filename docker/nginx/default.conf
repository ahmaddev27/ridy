# DASHCAM — nginx site config (Compose `nginx` service).
# Serves the Laravel application's public/ directory and proxies PHP requests
# to the `backend` PHP-FPM service over FastCGI (port 9000).

server {
    listen 80;
    server_name _;

    # Laravel's front controller lives in public/. The ./backend bind-mount
    # makes this path resolve to backend/public on the host.
    root /var/www/public;
    index index.php;

    charset utf-8;

    # Route every request through index.php unless the file exists on disk.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Favicon / robots: don't log, don't error if missing.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Reasonable upload ceiling for raw payload / document attachments.
    client_max_body_size 20m;

    # Hand .php requests to PHP-FPM in the `backend` container.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to hidden files (e.g. .env, .git) except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
