; Reidey PHP-FPM pools. Loaded after the image's www.conf / zz-docker.conf
; (alphabetical include order), so the [www] values here override the stock
; pm.max_children = 5 that let five slow requests stall the whole platform.
;
; Three pools:
;   [www]      :9000  everything (dashboard, driver app, extension, admin)
;   [dispatch] :9001  ONLY the daemon's internal offer/status ingest
;                     (/api/v1/internal/dispatch/*, routed by docker/Caddyfile)
;   [command]  :9002  ONLY the daemon's dispatch-command long-poll
;                     (/api/v1/internal/dispatch/commands*)
; so dashboard/driver polling can never queue the next offer's ingest behind it
; inside Uber's ~5 s accept window.
;
; [command] is split off [dispatch] for the opposite reason to the first split.
; Its one endpoint PARKS the request — it holds the connection open for up to 25 s
; waiting for a driver to tap "decline" — so N daemon boxes permanently occupy N
; workers. Left on [dispatch] those parks would eat the very ingest capacity that
; pool exists to protect, and one more box could starve it outright.
;
; Sizing: a Laravel worker is ~40-70 MB RSS. 32 + 12 + 8 workers stay well under
; the box's RAM and far below MySQL's default max_connections (151), which the
; scheduler, queue worker and reverb also draw from. 8 is generous for a parked
; poll: it is one per daemon box, not one per company or per offer.
;
; request_slowlog_timeout is deliberately NOT set: FPM's slowlog needs
; CAP_SYS_PTRACE, which the container does not have, so it would only spam
; "ptrace failed" errors.

[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000
listen.backlog = 511
; Wall-clock cap per request. max_execution_time only counts CPU time, so a
; request stuck on a network call (Uber sync, SMTP, a hung geocoder) would
; otherwise hold its worker forever. 120 s is above the slowest legitimate
; call (UberAuthClient, 60 s timeout).
request_terminate_timeout = 120s

[dispatch]
user = www-data
group = www-data
listen = 9001
listen.backlog = 511
; Same runtime environment as [www] (zz-docker/docker.conf only configure the
; [www] pool): keep the container env (APP_KEY, DB_*, ... come from compose,
; not a .env file) and route worker output to the container log.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
; Ingest must answer inside the daemon's 8 s apiTimeout; anything still running
; after 60 s is wedged.
request_terminate_timeout = 60s

[command]
user = www-data
group = www-data
listen = 9002
listen.backlog = 511
; Same runtime environment as [dispatch] — see the note there.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 1000
; The long-poll parks for at most DispatchCommandQueue::MAX_WAIT_SECONDS (25 s),
; so 60 s is a wide margin: anything still running past it is wedged, not parked.
request_terminate_timeout = 60s
