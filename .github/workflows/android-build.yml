name: Android Build & Submit

# Builds the driver app for Android on EAS (cloud) and, optionally, submits the
# resulting AAB straight to Google Play — all from GitHub Actions. Manual trigger.
#
# One-time setup by the account owner (interactive, done once, NOT in CI):
#   1. npm i -g eas-cli && eas login
#   2. eas credentials -p android      # let EAS generate/manage the upload keystore
#   3. For submit: create a Google Play service-account JSON with the "Release
#      manager" role, then set it in submit.production (serviceAccountKeyPath) or via
#      eas credentials. NOTE: Google requires the VERY FIRST upload of a brand-new
#      app (de.reidey.app is still "Draft") to be done manually in Play Console once;
#      after that, `--auto-submit` works from CI.
#
# Required GitHub secret:
#   EXPO_TOKEN  — an Expo access token (expo.dev → Account → Access Tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        default: production
        options:
          - preview
          - production
      submit:
        description: "Submit to Google Play after the build (production only)"
        type: boolean
        default: false

# Release hygiene: read-only token, one store release at a time, main only, and
# the store-release environment (add required reviewers + move EXPO_TOKEN and the
# Play key into it in Settings -> Environments so other branches cannot read them).
permissions:
  contents: read

concurrency:
  group: store-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  android:
    name: Android ${{ github.event.inputs.profile }}${{ github.event.inputs.submit == 'true' && ' + submit' || '' }}
    runs-on: ubuntu-latest
    environment: store-release
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: driver-app
    steps:
      # eas.json has no submit.preview profile: fail in seconds, not after a
      # full cloud build.
      - name: Validate inputs
        if: ${{ github.event.inputs.submit == 'true' && github.event.inputs.profile != 'production' }}
        working-directory: .
        run: |
          echo "::error::submit is only supported with the production profile"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: driver-app/package-lock.json

      # Pinned: this CLI runs with EXPO_TOKEN and the store key on disk.
      - name: Install eas-cli
        run: npm install -g eas-cli@22.3.0

      - name: Install dependencies
        run: npm ci

      # Materialize the Play service-account key (referenced by eas.json
      # submit.production.android.serviceAccountKeyPath) from a secret, only when
      # submitting. Written via env to avoid shell-quoting issues; never committed.
      - name: Write Play service account
        if: ${{ github.event.inputs.submit == 'true' }}
        env:
          PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SA_JSON" > play-service-account.json

      # Cloud build on EAS. --auto-submit (when requested) uploads the AAB to Google
      # Play using submit.production from eas.json + the service-account key above.
      # --non-interactive fails fast on any missing credential.
      - name: EAS build (+ submit)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive \
            ${{ github.event.inputs.submit == 'true' && '--auto-submit' || '' }}

      - name: Clean up service account key
        if: ${{ always() }}
        run: rm -f play-service-account.json
