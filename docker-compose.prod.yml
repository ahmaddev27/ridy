# Ridy — production stack for a fresh VPS (reidey.de).
#
# Services: caddy (TLS edge), backend (Laravel PHP-FPM), frontend (Next.js),
# mysql, dispatch-daemon (Node RAMEN stream). Values come from a root .env
# (see .env.prod.example). Deploy steps: docs/13-deployment.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build

# Container stdout/stderr rotation. The default json-file driver never rotates,
# so the daemon's per-cycle stream lines and FPM's access log slowly filled the
# disk that MySQL and the backups share. Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Shared Laravel environment for the backend + the scheduler (kept in one place
# via a YAML anchor so the two never drift).
x-app-env: &app-env
  APP_NAME: Ridy
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  APP_URL: https://${DOMAIN}
  FRONTEND_URL: https://${DOMAIN}
  # The published extension's exact origin (chrome-extension://<32-char id>).
  # In production CORS never falls back to "any extension" (config/cors.php);
  # the extension itself calls the API from its service worker under
  # host_permissions, which CORS does not gate, so empty is safe.
  EXTENSION_ORIGIN: ${EXTENSION_ORIGIN:-}
  # Logs: one file per day, kept LOG_DAILY_DAYS days (config/logging.php), at
  # info level. The old single laravel.log grew forever at debug level and kept
  # IPs/IDs indefinitely.
  LOG_STACK: ${LOG_STACK:-daily}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}
  # SANCTUM_STATEFUL_DOMAINS is deliberately NOT set: Sanctum then derives the
  # stateful host from APP_URL (= https://${DOMAIN}) automatically, so SPA-cookie
  # login just works from the domain with zero extra config. Single source of
  # truth = DOMAIN. (Override via .env only if you truly need extra hosts.)
  # SESSION_DOMAIN empty -> host-only session cookie for the domain.
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SESSION_DRIVER: database
  # Keep managers signed in ~1 year by default (minutes). "Remember me" relies on
  # this; override SESSION_LIFETIME in the root .env to change it.
  SESSION_LIFETIME: ${SESSION_LIFETIME:-525600}
  # Real-time (Laravel Reverb / WebSocket). The backend broadcasts to the reverb
  # service over the internal network (host=reverb); the app connects via Caddy at
  # wss://DOMAIN/app/<key>. App credentials come from the root .env (generate once
  # with `php artisan reverb:install` and copy REVERB_APP_ID/KEY/SECRET).
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  # Host patterns allowed to open a WebSocket (config/reverb.php). "*" until the
  # driver app's Origin header is confirmed; then e.g. REVERB_ALLOWED_ORIGINS=reidey.de
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-*}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  DB_CONNECTION: mysql
  # Defaults to the local mysql service; override DB_HOST/DB_PORT in .env to point
  # the app at a dedicated DB box during scale-out (see docs/19-scale-out-runbook.md).
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  DISPATCH_INGEST_SECRET: ${DISPATCH_INGEST_SECRET}
  # FCM HTTP v1 (OAuth2 service-account) — used by FcmPushSender for driver + web
  # push. Point FCM_CREDENTIALS at the mounted service-account JSON. Without it the
  # app falls back to LogPushSender (pushes are only logged, not sent).
  FCM_CREDENTIALS: ${FCM_CREDENTIALS:-}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  # Ops alerting: where broken-session / down-shard alerts are emailed (empty = log only).
  ALERT_EMAIL: ${ALERT_EMAIL:-}
  # Error tracking (Sentry/GlitchTip). Empty = disabled.
  SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
  FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
  # Fixed OTP for testing — leave OTP_TEST_CODE unset in prod for random codes.
  OTP_TEST_CODE: ${OTP_TEST_CODE:-}
  # Host-resource monitoring (admin System Health): the container reads the HOST's
  # /proc, mounted read-only on the backend service below. Disk usage is read
  # from the container's own "/": overlayfs reports the filesystem that holds
  # Docker's data root (images, the MySQL volume, logs) — the disk that actually
  # fills up — so the host root filesystem no longer has to be mounted.
  HOST_PROC_PATH: ${HOST_PROC_PATH:-/host/proc}
  HOST_DISK_PATH: ${HOST_DISK_PATH:-/}
  # Geocoding + routing (TripGeocoder). Empty = the public OSM services (rate-limited
  # ~1 req/s). Point these at the self-hosted containers to remove the limits —
  # NOMINATIM_URL=http://nominatim:8080, OSRM_URL=http://osrm:5000 (in the root .env),
  # and start them with `--profile geo`. Without this passthrough the backend never
  # sees the values and silently stays on public OSM. See docs/self-hosted-geo.md.
  NOMINATIM_URL: ${NOMINATIM_URL:-}
  OSRM_URL: ${OSRM_URL:-}

services:
  # --- Caddy — TLS edge + reverse proxy -------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    # Answer to the public domain on the internal network too, so containers
    # (the dispatch daemon) reach the API via Caddy directly instead of the host's
    # public IP — many VPS block that hairpin, which broke offer ingest.
    networks:
      default:
        aliases:
          - ${DOMAIN}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Branded maintenance page served when an upstream is unreachable (deploy/crash).
      - ./docker/maintenance:/srv/maintenance:ro
      # Backend public/ so Caddy can serve Laravel's front controller via FastCGI.
      - ./backend:/var/www
      - caddy_data:/data
      - caddy_config:/config

  # --- MySQL 8 --------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      # Server tuning (buffer pool, binlog retention, slow log) — see the file.
      - ./docker/mysql/reidey.cnf:/etc/mysql/conf.d/reidey.cnf:ro
    healthcheck:
      # No credentials: `mysqladmin ping` exits 0 whenever the server answers,
      # even with "access denied", so the root password never has to sit in the
      # container config (docker inspect) or the host's process list.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Backend — Laravel (PHP-FPM) ------------------------------------------
  backend:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      # Host-resource monitoring (admin System Health): expose the HOST's /proc
      # read-only so the backend can report the real machine's CPU / RAM /
      # network rather than the container's own limited view. The host root
      # filesystem is deliberately NOT mounted any more: that recursive bind
      # carried /run/docker.sock into the internet-facing FPM container (Docker
      # API = host root). Disk usage comes from the container's own "/" instead
      # (see HOST_DISK_PATH above).
      - /proc:/host/proc:ro

  # --- Scheduler — runs Laravel's cron (offers:expire-pending, …) -----------
  # Reuses the backend image but runs `schedule:work` instead of PHP-FPM, so no
  # host crontab is needed. One long-running process ticks every minute.
  scheduler:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Workers run as www-data (like the FPM workers), never root: a bug in a
    # scheduled command no longer runs as uid 0, and the log/cache/backup files
    # it creates stay writable by php-fpm.
    user: www-data
    security_opt: ["no-new-privileges:true"]
    command: php artisan schedule:work
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www
      - /var/www/vendor

  # --- Reverb — WebSocket server for real-time offers (Pusher protocol) -------
  # Reuses the backend image, runs the reverb daemon on :8080. Caddy proxies
  # wss://DOMAIN/app/* here; the backend publishes to it directly on :8080.
  reverb:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    user: www-data
    security_opt: ["no-new-privileges:true"]
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www
      - /var/www/vendor

  # --- Queue worker — processes ShouldQueue jobs (admin broadcast fan-out) ---
  # Without this, database-queued jobs are enqueued and never run. --tries=3 with
  # a short backoff; --max-time recycles the worker so a leaked handle can't grow.
  queue:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    user: www-data
    security_opt: ["no-new-privileges:true"]
    command: php artisan queue:work --queue=default --tries=3 --backoff=10 --max-time=3600 --sleep=2
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - ./backend:/var/www
      - /var/www/vendor

  # --- Frontend — Next.js dashboard -----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend.Dockerfile
      args:
        # Empty on purpose: the client bundle calls the API same-origin (relative
        # /api paths), so the dashboard works on EVERY domain Caddy serves without
        # a rebuild. Override only to force an absolute API base.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # Reverb (WebSocket) public app key — lets the dashboard subscribe to its
        # company channel for live offer updates. Reuses REVERB_APP_KEY (already set
        # for the reverb service); empty → the dashboard falls back to polling.
        NEXT_PUBLIC_REVERB_KEY: ${NEXT_PUBLIC_REVERB_KEY:-${REVERB_APP_KEY:-}}
    restart: unless-stopped
    logging: *default-logging
    # The image runs as the unprivileged `node` user (docker/frontend.Dockerfile).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # --- Dispatch daemon — holds the Uber RAMEN stream ------------------------
  dispatch-daemon:
    build:
      context: .
      dockerfile: ./docker/dispatch-daemon.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # The image runs as the unprivileged `node` user and only makes outbound
    # HTTPS calls, so it needs no Linux capabilities at all.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      - backend
    environment:
      # Reaches the API through Caddy over the public HTTPS domain (hairpin).
      RIDY_API_URL: https://${DOMAIN}
      DISPATCH_INGEST_SECRET: ${DISPATCH_INGEST_SECRET}
      UBER_DISPATCH_BASE_URL: https://vsdispatch.uber.com
      UBER_RAMEN_PATHS: /ramendca/events,/ramenphx/events
      # Residential proxy for all Uber traffic (empty = direct = blocked).
      UBER_PROXY_URL: ${UBER_PROXY_URL:-}
      # Shard identity. The backend assigns companies to shards by name and
      # returns only this box's slice. One box → "main". More boxes → give each a
      # distinct SHARD_ID and run the daemon-only stack there. See docs/18.
      SHARD_ID: ${SHARD_ID:-main}
      # Sentry error tracking for the daemon (empty = disabled).
      SENTRY_DSN: ${DAEMON_SENTRY_DSN:-}

  # --- Self-hosted geocoding + routing (opt-in via the "geo" profile) --------
  # Removes the free public services' ~1 req/s rate limit so trip distances fill
  # instantly at scale. NOT started by a normal deploy (profile-gated); import
  # Germany once, then set NOMINATIM_URL/OSRM_URL and start with --profile geo.
  # See docs/self-hosted-geo.md for the one-time import steps.
  nominatim:
    image: mediagis/nominatim:4.4
    profiles: ["geo"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      PBF_URL: ${GEO_PBF_URL:-https://download.geofabrik.de/europe/germany-latest.osm.pbf}
      REPLICATION_URL: ${GEO_REPLICATION_URL:-https://download.geofabrik.de/europe/germany-updates/}
      IMPORT_STYLE: address
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    shm_size: 1g
    # Internal only — reached by the backend as http://nominatim:8080.

  osrm:
    image: osrm/osrm-backend:latest
    profiles: ["geo"]
    restart: unless-stopped
    logging: *default-logging
    # Serves the pre-built graph produced by the one-time prep in the docs.
    # Uses MLD (partition/customize); switch to CH if you prepared with contract.
    command: osrm-routed --algorithm mld /data/germany-latest.osrm
    volumes:
      - osrm_data:/data
    # Internal only — reached by the backend as http://osrm:5000.

volumes:
  dbdata:
  caddy_data:
  caddy_config:
  nominatim_data:
  osrm_data:
