; Reidey PHP runtime settings, layered on top of php.ini-production.
; Loaded by every SAPI in the backend image (php-fpm AND the CLI that runs the
; scheduler, queue worker and reverb), so keep CLI-sensitive values neutral.

; --- OPcache ---------------------------------------------------------------
; Without OPcache every request recompiles the whole framework (2-4x slower),
; which is what let a handful of slow requests exhaust the FPM pool.
opcache.enable = 1
; CLI stays off: long-running workers gain nothing and artisan one-offs would
; only fill a throw-away cache.
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code is bind-mounted and replaced in place by the deploy (git reset,
; config:cache, compiled Blade views). Keep timestamp validation ON with a short
; revalidate window so a rewritten file is never served stale; the stat cost is
; negligible next to the compile cost OPcache removes.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; --- Filesystem --------------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Limits ------------------------------------------------------------------
memory_limit = 256M
; Admin ad images validate up to 4 MB (AdController); the stock 2M upload cap
; rejected those before Laravel ever saw them. Caddy caps bodies at 12 MB.
upload_max_filesize = 8M
post_max_size = 10M

; --- Hardening ---------------------------------------------------------------
expose_php = Off
