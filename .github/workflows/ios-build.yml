name: iOS Build & Submit

# Builds the driver app for iOS on EAS (cloud) and, optionally, submits the
# resulting build straight to App Store Connect — all from GitHub Actions, so no
# local Mac is needed. Manual trigger only.
#
# One-time setup by the Apple account owner (interactive, done once, NOT in CI):
#   1. npm i -g eas-cli && eas login
#   2. eas credentials -p ios         # register de.reidey.driver, create the
#                                      # Distribution certificate + provisioning
#                                      # profile (let EAS manage them)
#   3. Set up the App Store Connect API key for submit (eas credentials → iOS →
#      "App Store Connect: Manage your API Key"), so `--auto-submit` is non-interactive.
#
# Required GitHub secret:
#   EXPO_TOKEN  — an Expo access token (expo.dev → Account → Access Tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        default: production
        options:
          - preview
          - production
      submit:
        description: "Submit to App Store Connect after the build"
        type: boolean
        default: false

jobs:
  ios:
    name: iOS ${{ github.event.inputs.profile }}${{ github.event.inputs.submit == 'true' && ' + submit' || '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: driver-app/package-lock.json

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      # Materialize the App Store Connect API key (.p8) from a secret. With the
      # EXPO_ASC_* env vars below, EAS authenticates to Apple non-interactively —
      # it can create/manage the Distribution cert + provisioning profile for the
      # build and upload with --auto-submit, no Apple ID password or local Mac.
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: printf '%s' "$ASC_KEY_P8" > ios-asc-key.p8

      # Cloud build on EAS. --auto-submit (when requested) hands the finished build
      # straight to App Store Connect using submit.production from eas.json.
      # --non-interactive fails fast if any credential is missing.
      - name: EAS build (+ submit)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ios-asc-key.p8
          EXPO_ASC_KEY_ID: "2Z7W8XYK92"
          EXPO_ASC_ISSUER_ID: "428c0e59-a43f-4a07-8537-a224d7dc5cf8"
        run: |
          eas build \
            --platform ios \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive \
            ${{ github.event.inputs.submit == 'true' && '--auto-submit' || '' }}

      - name: Clean up API key
        if: ${{ always() }}
        run: rm -f ios-asc-key.p8
