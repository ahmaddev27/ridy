# Standalone geocoding + routing stack for a DEDICATED box.
#
# Run this on its own VPS (not the app server) so heavy imports + high-throughput
# geocoding never compete with the live app. Nominatim answers address lookups
# (100+ req/s locally, no rate limit); OSRM answers routing (thousands/s).
#
# Network exposure — read this before starting it:
#   Both ports are published ONLY on GEO_BIND_IP (required; compose refuses to
#   start without it). Set it to the box's PRIVATE address — the provider's
#   vLAN/private network, or a WireGuard interface (e.g. wg0) shared with the
#   app server. Never 0.0.0.0: Docker writes published ports into iptables
#   ahead of ufw/firewalld, so a host-firewall "allow only the app server" rule
#   does NOT protect a port published on a public interface. If you must filter
#   anyway, put the rule in the DOCKER-USER chain, e.g.
#     iptables -I DOCKER-USER -i eth0 ! -s <APP_SERVER_IP> -p tcp -m multiport --dports 8080,5000 -j DROP
#   Traffic is plain HTTP and carries every trip's pickup/drop-off address, so it
#   must stay on the private network (DSGVO).
#
# After it's up, point the app at it via the GitHub secrets:
#   NOMINATIM_URL = http://<GEO_BIND_IP>:8080
#   OSRM_URL      = http://<GEO_BIND_IP>:5000
#
# Recommended box: 8-16 GB RAM, 100 GB SSD, 4 vCPU. Germany import runs a few
# hours; the DB persists in the nominatim_data volume.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # --- Nominatim: address -> coordinates (Germany extract) -------------------
  nominatim:
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GEO_BIND_IP:?GEO_BIND_IP must be the private/WireGuard IP to publish on}:8080:8080"
    environment:
      # Import Germany on first boot. Swap for a wider extract (e.g. dach or
      # europe) if you need cross-border trips (NL/BE/…): see download.geofabrik.de.
      PBF_URL: ${GEO_PBF_URL:-https://download.geofabrik.de/europe/germany-latest.osm.pbf}
      REPLICATION_URL: ${GEO_REPLICATION_URL:-https://download.geofabrik.de/europe/germany-updates/}
      IMPORT_STYLE: address # lighter, address-focused import
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    shm_size: 1g

  # --- OSRM: coordinates -> road distance + route ----------------------------
  # Serves the pre-built graph produced by the one-time prep in the guide.
  osrm:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GEO_BIND_IP:?GEO_BIND_IP must be the private/WireGuard IP to publish on}:5000:5000"
    command: osrm-routed --algorithm mld /data/germany-latest.osrm
    volumes:
      - osrm_data:/data

volumes:
  nominatim_data:
  osrm_data:
