<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light; }
      body {
        width: 320px;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #0f172a;
        background: #fff;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid #e2e8f0;
      }
      header .logo {
        width: 34px; height: 34px; border-radius: 8px;
        display: block; object-fit: contain;
      }
      header h1 { font-size: 15px; margin: 0; }
      main { padding: 16px; }
      button {
        width: 100%; padding: 10px; border: 0; border-radius: 8px;
        background: #000; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      button.secondary { background: #f1f5f9; color: #0f172a; }
      .status { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 8px; display: none; }
      .status.ok { display: block; background: #ecfdf5; color: #047857; }
      .status.err { display: block; background: #fef2f2; color: #b91c1c; }
      .hint { font-size: 12px; color: #64748b; margin-top: 10px; line-height: 1.5; }
      .paired-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #047857; margin-bottom: 12px; }
      .paired-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
      .unpaired { font-size: 13px; color: #b91c1c; background: #fef2f2; padding: 10px; border-radius: 8px; margin-bottom: 12px; line-height: 1.5; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <header>
      <img class="logo" src="icons/icon-48.png" alt="Reidey" />
      <h1>Reidey Uber Connector</h1>
    </header>
    <main>
      <!-- Paired: the dashboard has handed us a token — show the connect action. -->
      <div id="paired-view" class="hidden">
        <div class="paired-badge"><span class="dot"></span> Mit Reidey verbunden</div>
        <button id="connect">Uber-Sitzung verbinden</button>
        <p class="hint">
          Melde dich zuerst bei <b>fleethub.uber.com</b> an und klicke dann hier.
        </p>
      </div>

      <!-- Not paired: no manual token entry. Pairing happens on the dashboard. -->
      <div id="unpaired-view" class="hidden">
        <div class="unpaired">
          Die Erweiterung ist noch nicht gekoppelt. Öffne dein Reidey-Dashboard und
          gehe zu <b>Uber-Verbindung</b> — die Kopplung passiert automatisch.
        </div>
        <button id="open-dashboard" class="secondary">Reidey-Dashboard öffnen</button>
      </div>

      <div id="status" class="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
