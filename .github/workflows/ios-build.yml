name: iOS Build & Submit

# Builds the driver app for iOS on EAS (cloud) and, optionally, submits the
# resulting build straight to App Store Connect — all from GitHub Actions, so no
# local Mac is needed. Manual trigger only.
#
# One-time setup by the Apple account owner (interactive, done once, NOT in CI):
#   1. npm i -g eas-cli && eas login
#   2. eas credentials -p ios         # register de.reidey.driver, create the
#                                      # Distribution certificate + provisioning
#                                      # profile (let EAS manage them)
#   3. Set up the App Store Connect API key for submit (eas credentials → iOS →
#      "App Store Connect: Manage your API Key"), so `--auto-submit` is non-interactive.
#
# Required GitHub secret:
#   EXPO_TOKEN  — an Expo access token (expo.dev → Account → Access Tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        default: production
        options:
          - preview
          - production
      submit:
        description: "Submit to App Store Connect after the build"
        type: boolean
        default: false

jobs:
  ios:
    name: iOS ${{ github.event.inputs.profile }}${{ github.event.inputs.submit == 'true' && ' + submit' || '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: driver-app/package-lock.json

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      # Cloud build on EAS. --auto-submit (when requested) hands the finished build
      # straight to App Store Connect using submit.production from eas.json + the
      # App Store Connect API key stored in EAS credentials. --non-interactive fails
      # fast if any credential is missing rather than hanging on a prompt.
      - name: EAS build (+ submit)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive \
            ${{ github.event.inputs.submit == 'true' && '--auto-submit' || '' }}
